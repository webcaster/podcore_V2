name: Tutorial Studio Release

on:
  push:
    tags:
      - 'tutorial-studio-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Paket (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: pnpm exec electron-builder --win nsis --publish never
            artifact: tutorial-studio/release/*.exe
          - os: macos-latest
            command: pnpm exec electron-builder --mac dmg zip --publish never
            artifact: tutorial-studio/release/*.{dmg,zip}
    defaults:
      run:
        working-directory: tutorial-studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tutorial-studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-studio-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/tutorial-studio-v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
